# Cloudflare Pages config. See docs/cloudflare-setup.md.
name = "mjkitchen"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "mjkitchen"
# Replace with the id printed by `npx wrangler d1 create mjkitchen`.
# The id is not a secret; it only works with your Cloudflare login.
database_id = "ae173c12-d209-48ae-b350-3d8ff8d6896f"
migrations_dir = "migrations"
