# Cloudflare Worker config. See docs/cloudflare-setup.md.
# `name` must match the Worker's name in the Cloudflare dashboard.
name = "mjkitchen"
main = "server/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# The built storefront. Unknown paths get index.html so /checkout etc. work on reload.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "mjkitchen"
# Replace with the id printed by `npx wrangler d1 create mjkitchen`.
# The id is not a secret; it only works with your Cloudflare login.
database_id = "ae173c12-d209-48ae-b350-3d8ff8d6896f"
migrations_dir = "migrations"
